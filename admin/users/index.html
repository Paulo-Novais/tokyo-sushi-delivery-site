<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Usuários do restaurante | INOVAS Food</title>
    <link rel="icon" href="/assets/inovas-logo-header.png" />
    <link rel="stylesheet" href="/admin/users/users.css" />
    <script src="/admin/users/users.js" defer></script>
  </head>
  <body class="users-body" data-user-domain="RESTAURANT" data-user-view="list">
    <div class="users-shell">
      <aside class="users-sidebar" data-users-sidebar></aside>
      <main class="users-main">
        <header class="users-mobilebar">
          <img src="/assets/inovas-food-logo-oficial.png" alt="INOVAS Food" />
          <a href="/admin/">Painel</a>
        </header>
        <section class="users-support-banner" data-support-banner hidden></section>
        <div class="users-content" data-users-app>
          <div class="users-loading"><span class="users-spinner" aria-hidden="true"></span><span>Carregando usuários…</span></div>
        </div>
      </main>
    </div>
    <dialog class="users-dialog" data-user-dialog></dialog>
    <div class="users-toast" data-users-toast role="status" aria-live="polite" hidden></div>
  </body>
</html>
