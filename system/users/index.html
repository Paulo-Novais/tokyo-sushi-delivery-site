<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Usuários INOVAS | INOVAS Food</title>
    <link rel="icon" href="/assets/inovas-logo-header.png" />
    <link rel="stylesheet" href="/system/system.css" />
    <script src="/system/system.js" defer></script>
  </head>
  <body class="sys-body" data-user-domain="SYSTEM" data-system-view="users">
    <div class="sys-shell users-shell" data-system-shell data-menu-open="false">
      <header class="sys-topbar">
        <a href="/system"><img src="/assets/inovas-food-logo-oficial.png" alt="INOVAS Food" /></a>
        <button class="sys-btn sys-menu-btn" type="button" data-action="menu" aria-label="Abrir menu" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16 M4 12h16 M4 17h16"></path></svg>
        </button>
      </header>
      <button class="sys-drawer-backdrop" type="button" data-action="menu-close" aria-label="Fechar menu"></button>
      <aside class="sys-sidebar" data-system-sidebar></aside>
      <main class="sys-main">
        <div class="sys-content" data-system-app>
          <div class="sys-card sys-state" role="status" aria-busy="true">
            <span class="sys-spinner" aria-hidden="true"></span>
            <strong>Carregando a plataforma…</strong>
          </div>
        </div>
      </main>
      <nav class="sys-bottomnav" aria-label="Navegação rápida" data-system-bottomnav></nav>
    </div>
    <dialog class="sys-dialog" data-system-dialog></dialog>
    <div class="sys-toast" data-system-toast role="status" aria-live="polite" hidden></div>
  </body>
</html>
