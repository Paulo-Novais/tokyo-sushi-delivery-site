<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Usuários INOVAS | Painel System INOVAS</title>
    <link rel="icon" href="/assets/inovas-logo-header.png" />
    <link rel="stylesheet" href="/system/system.css" />
    <script src="/system/system-shell.js" defer></script>
    <script src="/system/users/team.js" defer></script>
  </head>
  <body class="sys-body" data-user-domain="SYSTEM">
    <div class="sys-shell">
      <aside class="sys-sidebar" data-sys-sidebar aria-label="Menu do Painel System"></aside>
      <div class="sys-backdrop" data-sys-backdrop></div>
      <main class="sys-main">
        <header class="sys-topbar">
          <a href="/system"><img src="/assets/inovas-food-logo-menu.png" alt="INOVAS Food" /></a>
          <button type="button" class="sys-icon-btn" data-sys-menu-toggle aria-label="Abrir menu" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18 M3 12h18 M3 18h18"></path></svg>
          </button>
        </header>
        <div class="sys-content" data-team-app>
          <div class="sys-loading"><span class="sys-spinner" aria-hidden="true"></span><span>Carregando a equipe INOVAS…</span></div>
        </div>
        <nav class="sys-bottomnav" data-sys-bottomnav aria-label="Navegação rápida"></nav>
      </main>
    </div>
    <div class="sys-toast" data-team-toast role="status" aria-live="polite" hidden></div>
  </body>
</html>
