<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Editar usuário INOVAS | Painel System INOVAS</title>
    <link rel="icon" href="/assets/inovas-logo-header.png" />
    <link rel="stylesheet" href="/admin/users/users.css" />
    <link rel="stylesheet" href="/system/system.css" />
    <script src="/system/system-shell.js" defer></script>
    <script src="/admin/users/users.js" defer></script>
  </head>
  <body class="users-body sys-body" data-user-domain="SYSTEM" data-user-view=editor data-user-mode=edit>
    <div class="users-shell sys-shell">
      <aside class="users-sidebar sys-sidebar" data-users-sidebar data-sys-sidebar aria-label="Menu do Painel System"></aside>
      <div class="sys-backdrop" data-sys-backdrop></div>
      <main class="users-main sys-main">
        <header class="sys-topbar">
          <a href="/system"><img src="/assets/inovas-food-logo-menu.png" alt="INOVAS Food" /></a>
          <button type="button" class="sys-icon-btn" data-sys-menu-toggle aria-label="Abrir menu" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18 M3 12h18 M3 18h18"></path></svg>
          </button>
        </header>
        <div class="users-content" data-users-app>
          <div class="users-loading"><span class="users-spinner" aria-hidden="true"></span><span>Carregando usuário…</span></div>
        </div>
        <nav class="sys-bottomnav" data-sys-bottomnav aria-label="Navegação rápida"></nav>
      </main>
    </div>
    <dialog class="users-dialog" data-user-dialog></dialog>
    <div class="users-toast" data-users-toast data-roles-toast role="status" aria-live="polite" hidden></div>
  </body>
</html>
