<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Entrar · INOVAS Food</title>
    <link rel="stylesheet" href="/conta/conta.css" />
  </head>
  <body>
    <main class="conta-shell">
      <section class="conta-card" aria-labelledby="conta-titulo">
        <header class="conta-head">
          <img class="conta-logo" src="/assets/inovas-food-logo-oficial-480.webp" alt="INOVAS Food" width="160" height="80" />
          <p class="conta-tag" data-conta-tag>Conta para pedidos</p>
          <h1 id="conta-titulo" data-conta-title>Entrar</h1>
          <p class="conta-sub" data-conta-sub>Use sua conta Google ou seu e-mail e senha.</p>
        </header>

        <div class="conta-alert" data-conta-alert role="alert" hidden></div>

        <!-- Entrar -->
        <div data-conta-view="entrar" hidden>
          <button class="conta-google" type="button" data-conta-google hidden>
            <svg viewBox="0 0 48 48" aria-hidden="true" width="20" height="20"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Entrar com Google
          </button>
          <div class="conta-divider" data-conta-divider hidden><span>ou</span></div>
          <form class="conta-form" data-conta-form="entrar" novalidate>
            <label>E-mail<input name="email" type="email" autocomplete="email" required /></label>
            <label>Senha<input name="password" type="password" autocomplete="current-password" required minlength="8" /></label>
            <button class="conta-primary" type="submit">Entrar com e-mail</button>
          </form>
          <div class="conta-links">
            <a href="#" data-conta-go="esqueci">Esqueci minha senha</a>
            <a href="#" data-conta-go="criar">Criar conta</a>
          </div>
        </div>

        <!-- Criar conta -->
        <div data-conta-view="criar" hidden>
          <form class="conta-form" data-conta-form="criar" novalidate>
            <label>Nome<input name="name" autocomplete="name" required maxlength="160" /></label>
            <label>Telefone com DDD<input name="phone" type="tel" inputmode="numeric" autocomplete="tel" required placeholder="(16) 99999-9999" /></label>
            <label>E-mail<input name="email" type="email" autocomplete="email" required /></label>
            <label>Senha (mínimo 8 caracteres)<input name="password" type="password" autocomplete="new-password" required minlength="8" /></label>
            <button class="conta-primary" type="submit">Criar conta</button>
          </form>
          <div class="conta-links"><a href="#" data-conta-go="entrar">Já tenho conta</a></div>
        </div>

        <!-- Esqueci minha senha -->
        <div data-conta-view="esqueci" hidden>
          <form class="conta-form" data-conta-form="esqueci" novalidate>
            <label>E-mail da conta<input name="email" type="email" autocomplete="email" required /></label>
            <button class="conta-primary" type="submit">Enviar link para criar nova senha</button>
          </form>
          <div class="conta-links"><a href="#" data-conta-go="entrar">Voltar para entrar</a></div>
        </div>

        <!-- Nova senha (link do e-mail) -->
        <div data-conta-view="nova-senha" hidden>
          <form class="conta-form" data-conta-form="nova-senha" novalidate>
            <label>Nova senha (mínimo 8 caracteres)<input name="password" type="password" autocomplete="new-password" required minlength="8" /></label>
            <label>Repita a nova senha<input name="password2" type="password" autocomplete="new-password" required minlength="8" /></label>
            <button class="conta-primary" type="submit">Salvar nova senha</button>
          </form>
        </div>

        <!-- Telefone (primeiro acesso pelo Google) -->
        <div data-conta-view="telefone" hidden>
          <form class="conta-form" data-conta-form="telefone" novalidate>
            <label>Telefone com DDD<input name="phone" type="tel" inputmode="numeric" autocomplete="tel" required placeholder="(16) 99999-9999" /></label>
            <button class="conta-primary" type="submit">Continuar</button>
          </form>
        </div>

        <!-- Conectado (aberto direto, sem restaurante) -->
        <div data-conta-view="conectado" hidden>
          <button class="conta-secondary" type="button" data-conta-sair>Sair desta conta</button>
        </div>

        <p class="conta-foot">Seus dados de pedido ficam separados em cada restaurante. <span data-conta-voltar></span></p>
      </section>
    </main>
    <script src="/conta/conta.js" defer></script>
  </body>
</html>
