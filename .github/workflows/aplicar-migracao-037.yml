# Aplica no banco de PRODUÇÃO (Neon) a atualização 037: tabela das notas
# fiscais (NFC-e). Só roda à mão (Actions > Aplicar atualização 037 > Run
# workflow), com a confirmação digitada e o GO do Paulo.
# Antes de rodar: backup no Neon (Branches > Create branch).
# Para desfazer: migrations/037_fiscal_invoices.rollback.sql (apaga só a tabela nova).
# Pode rodar de novo sem problema (já aplicada não muda nada).
name: Aplicar atualização 037 (nota fiscal)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite APLICAR-037 para confirmar (banco de PRODUÇÃO)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir confirmação
        if: ${{ inputs.confirmar != 'APLICAR-037' }}
        run: |
          echo "::error::Confirmação incorreta. Nada foi feito."
          exit 1
      - name: Conferir segredo
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Falta o segredo MIGRATION_DATABASE_URL. Nada foi feito."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Aplicar 037
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f migrations/037_fiscal_invoices.sql
      - name: Conferir resultado
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -t -c "
            SELECT 'fiscal_invoices: ' || CASE WHEN relrowsecurity AND relforcerowsecurity THEN 'ok (RLS ligado)' ELSE 'SEM RLS' END
            FROM pg_class WHERE relname = 'fiscal_invoices';"
