# Gera o APK do app INOVAS Garçom (Android) num computador do GitHub.
# A cada mudança em apps/garcom-android o APK fica como artefato da execução
# (aba Actions > App Garçom Android > Artifacts), para baixar e testar.
#
# Assinatura: com os segredos GARCOM_KEYSTORE_BASE64, GARCOM_KEYSTORE_PASSWORD,
# GARCOM_KEY_ALIAS e GARCOM_KEY_PASSWORD (Settings > Secrets > Actions) o APK
# sai com a chave oficial (atualiza por cima, sem desinstalar). Sem eles, sai
# com chave de teste (serve só para testar).
#
# Publicar para os restaurantes (Release "garcom-android") precisa de GO do
# Paulo: rodar à mão com "publicar" marcado. Só publica com a chave oficial.
name: App Garçom Android

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Release garcom-android (link de download). Só com GO do Paulo."
        type: boolean
        default: false
      versao:
        description: "Versão do app (ex.: 1.0.1)"
        type: string
        default: "1.0.0"
  push:
    paths:
      - "apps/garcom-android/**"
      - ".github/workflows/build-android-garcom.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Chave de assinatura (se configurada)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.GARCOM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/garcom.jks"
            echo "GARCOM_KEYSTORE_FILE=$RUNNER_TEMP/garcom.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem a chave oficial: APK de teste."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gerar APK
        env:
          GARCOM_KEYSTORE_PASSWORD: ${{ secrets.GARCOM_KEYSTORE_PASSWORD }}
          GARCOM_KEY_ALIAS: ${{ secrets.GARCOM_KEY_ALIAS }}
          GARCOM_KEY_PASSWORD: ${{ secrets.GARCOM_KEY_PASSWORD }}
        run: |
          gradle -p apps/garcom-android assembleRelease \
            -PversionName="${{ inputs.versao || '1.0.0' }}" \
            -PversionCode="${{ github.run_number }}"
          cp apps/garcom-android/app/build/outputs/apk/release/app-release.apk INOVAS-Garcom.apk
          rm -f "$RUNNER_TEMP/garcom.jks"
          sha256sum INOVAS-Garcom.apk
      - uses: actions/upload-artifact@v4
        with:
          name: INOVAS-Garcom
          path: INOVAS-Garcom.apk
          if-no-files-found: error

  publicar:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Exigir chave oficial
        if: ${{ needs.build.outputs.signed != 'true' }}
        run: |
          echo "::error::Publicar exige a chave oficial (segredos GARCOM_*)."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: INOVAS-Garcom
      - name: Enviar para o Release garcom-android
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '{"version":"%s","sha256":"%s"}\n' "${{ inputs.versao }}" "$(sha256sum INOVAS-Garcom.apk | cut -d' ' -f1)" > versao-garcom.json
          gh release view garcom-android >/dev/null 2>&1 || \
            gh release create garcom-android --title "INOVAS Garçom (Android)" --notes "App do garçom para Android." --latest=false
          if gh release download garcom-android -p INOVAS-Garcom.apk -O INOVAS-Garcom-anterior.apk 2>/dev/null; then
            gh release upload garcom-android INOVAS-Garcom-anterior.apk --clobber
          fi
          gh release upload garcom-android INOVAS-Garcom.apk versao-garcom.json --clobber
