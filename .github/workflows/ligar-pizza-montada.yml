# Liga a "Montagem de pizza" de um restaurante no banco de PRODUÇÃO (Neon), pelo
# mesmo código do Gestor. Só roda à mão (Actions > Ligar pizza montada > Run workflow).
# Primeiro rode com "simular" para conferir; depois com "aplicar".
name: Ligar pizza montada

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular ou aplicar'
        required: true
        default: simular
        type: choice
        options: [simular, aplicar]
      nome:
        description: 'Parte do nome/endereço do restaurante'
        required: true
        default: 'kasulo'
        type: string
      sabores:
        description: 'Quantos sabores (ex.: 1,2,4)'
        required: true
        default: '1,2,4'
        type: string
      bordas:
        description: 'Bordas e preços (ex.: Catupiry=0,Cheddar=0,Muçarela=0)'
        required: true
        default: 'Catupiry=0,Cheddar=0,Muçarela=0'
        type: string

permissions:
  contents: read

jobs:
  ligar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir segredo
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Falta o segredo MIGRATION_DATABASE_URL. Nada foi feito."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - name: Ligar montagem de pizza
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MODO: ${{ inputs.modo }}
          NOME: ${{ inputs.nome }}
          SABORES: ${{ inputs.sabores }}
          BORDAS: ${{ inputs.bordas }}
        run: |
          FLAG=""
          if [ "$MODO" = "aplicar" ]; then FLAG="--aplicar"; fi
          node scripts/set-pizza-builder.cjs --nome "$NOME" --sabores "$SABORES" --bordas "$BORDAS" $FLAG
