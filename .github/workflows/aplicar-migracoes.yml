# Aplica no banco de PRODUÇÃO (Neon) as atualizações 030 a 034:
# caixa sem duplicar, "Gestor aberto", extrato/repasse, pagamento online e
# permissões. Só roda à mão (Actions > Aplicar atualizações do banco > Run
# workflow), com a confirmação digitada e o GO do Paulo.
#
# Precisa do segredo MIGRATION_DATABASE_URL (Settings > Secrets and variables
# > Actions): a "connection string" do Neon com o usuário dono do banco
# (Neon > Connect > Connection string). O GitHub esconde o valor nos logs.
#
# Antes de rodar: crie um backup no Neon (Branches > Create branch) e deixe
# o app do Gestor aberto no restaurante (a 031 liga a regra "Gestor aberto").
# Para desfazer: rode os arquivos .rollback.sql de 034 a 030 no SQL Editor.
name: Aplicar atualizações do banco

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite APLICAR-030-034 para confirmar (banco de PRODUÇÃO)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir confirmação
        if: ${{ inputs.confirmar != 'APLICAR-030-034' }}
        run: |
          echo "::error::Confirmação incorreta. Nada foi feito."
          exit 1
      - name: Conferir segredo
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Falta o segredo MIGRATION_DATABASE_URL. Nada foi feito."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Aplicar 030 a 034
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          for file in \
            030_cash_register_operations \
            031_restaurant_presence \
            032_restaurant_payouts \
            033_online_payments \
            034_payments_runtime_grants; do
            echo "== $file"
            set +e
            psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "migrations/$file.sql" > saida.txt 2>&1
            status=$?
            set -e
            grep -v "does not exist, skipping" saida.txt || true
            if [ "$status" -ne 0 ]; then
              echo "::error::Falhou em $file (as anteriores ficaram aplicadas)."
              exit 1
            fi
          done
      - name: Conferir resultado
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -t -c "
            SELECT tablename || ': ok' FROM pg_tables
            WHERE schemaname = 'public' AND tablename IN (
              'cash_register_operations', 'restaurant_presence', 'restaurant_ledger_entries',
              'restaurant_payouts', 'online_payments', 'restaurant_payment_accounts')
            ORDER BY 1;"
