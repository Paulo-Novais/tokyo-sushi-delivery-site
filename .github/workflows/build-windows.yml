# Gera o instalador do INOVAS PDV para Windows (NSIS) num computador Windows do GitHub.
# Roda os testes unitários antes. Não publica nada: o instalador fica como
# artefato da execução (aba Actions), para baixar e testar.
# Publicar para clientes (Releases / botão do site) precisa de GO do Paulo:
# rodar à mão (Actions > Instalador Windows > Run workflow) com "publicar"
# marcado. Antes de trocar, guarda o instalador atual como
# INOVAS-PDV-Setup-anterior.exe no mesmo Release (para voltar, basta subir
# esse arquivo de novo com o nome INOVAS-PDV-Setup.exe).
name: Instalador Windows

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Release gestor-pdv (botão Baixar Gestor do site). Só com GO do Paulo."
        type: boolean
        default: false
  push:
    branches: ["app-pdv"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Nome fixo do instalador
        shell: pwsh
        run: Copy-Item (Get-ChildItem dist/INOVAS-PDV-Setup-*.exe | Select-Object -First 1).FullName dist/INOVAS-PDV-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: INOVAS-PDV-Setup
          path: dist/INOVAS-PDV-Setup.exe
          if-no-files-found: error
          retention-days: 30

  publicar:
    # Só roda à mão, com "publicar" marcado.
    if: github.event_name == 'workflow_dispatch' && inputs.publicar == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: gestor-pdv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: INOVAS-PDV-Setup
          path: novo
      - name: Guardar o instalador atual como INOVAS-PDV-Setup-anterior.exe
        run: |
          mkdir -p anterior
          gh release download "$TAG" -p INOVAS-PDV-Setup.exe -D anterior
          mv anterior/INOVAS-PDV-Setup.exe anterior/INOVAS-PDV-Setup-anterior.exe
          gh release upload "$TAG" anterior/INOVAS-PDV-Setup-anterior.exe --clobber
      - name: Publicar o instalador novo
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "$TAG" novo/INOVAS-PDV-Setup.exe --clobber
          # versao.json vai por último: o app só vê a versão nova quando o
          # instalador já está no Release. Ele confere o SHA-256 antes de usar.
          node -e "
            const fs = require('fs'); const crypto = require('crypto');
            const file = 'novo/INOVAS-PDV-Setup.exe';
            const data = fs.readFileSync(file);
            fs.writeFileSync('novo/versao.json', JSON.stringify({
              version: require('./package.json').version,
              sha256: crypto.createHash('sha256').update(data).digest('hex'),
              size: data.length,
              file: 'INOVAS-PDV-Setup.exe',
            }, null, 2));
          "
          cat novo/versao.json
          gh release upload "$TAG" novo/versao.json --clobber
          gh release edit "$TAG" --title "INOVAS PDV (Gestor para Windows) $VERSION" --notes "Instalador do app INOVAS PDV $VERSION para Windows (Pedidos, Caixa e Comandas, Cardápio), com o mesmo login do Gestor. A versão anterior fica em INOVAS-PDV-Setup-anterior.exe."
          sha256sum novo/INOVAS-PDV-Setup.exe
