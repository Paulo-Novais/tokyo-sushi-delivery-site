# Gera o instalador do INOVAS PDV para Windows (NSIS) num computador Windows do GitHub.
# Roda os testes unitários antes. Não publica nada: o instalador fica como
# artefato da execução (aba Actions), para baixar e testar. Branches fix/** geram
# instaladores de teste.
# Publicar para clientes (Releases / botão do site) precisa de GO do Paulo.
name: Instalador Windows

on:
  workflow_dispatch:
  push:
    branches: ["app-pdv", "fix/**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Nome fixo do instalador
        shell: pwsh
        run: Copy-Item (Get-ChildItem dist/INOVAS-PDV-Setup-*.exe | Select-Object -First 1).FullName dist/INOVAS-PDV-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: INOVAS-PDV-Setup
          path: dist/INOVAS-PDV-Setup.exe
          if-no-files-found: error
          retention-days: 30
