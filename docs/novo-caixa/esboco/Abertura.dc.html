<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixa — Abertura do caixa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7}
a{color:#C2410C}a:hover{color:#9A3412}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 880px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #12151A; background: #F4F5F7; padding: clamp(12px, 2.5vw, 32px)">
  <div style="max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="margin-right: auto">
        <div style="font-size: 14px; color: #5A6270; font-weight: 600">Terça, 10/11 · Turno da noite</div>
        <h1 style="margin: 4px 0 0; font-size: clamp(24px, 3vw, 32px); font-weight: 800">Abrir caixa</h1>
      </div>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #C7CDD4; background: #FFFFFF; font-size: 15px; font-weight: 600; color: #12151A">Usar mesma quantidade do último turno</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">

      <section aria-label="Dados do caixa" style="flex: 1 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE1E6; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="op" style="font-size: 14px; font-weight: 600">Operador do caixa</label>
          <input id="op" type="text" value="Paulo" style="height: 48px; border-radius: 10px; border: 1px solid #C7CDD4; padding: 0 14px; font-size: 16px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="fundo" style="font-size: 14px; font-weight: 600">Fundo de troco (R$)</label>
          <input id="fundo" type="text" value="200,00" style="height: 48px; border-radius: 10px; border: 1px solid #C7CDD4; padding: 0 14px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">
        </div>

        <div style="height: 1px; background: #E5E8EC"></div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 14px; font-weight: 600">Quantidade de mesas hoje</div>
          <div style="display: flex; align-items: center; gap: 10px">
            <button type="button" aria-label="Menos mesas" onClick="{{decMesas}}" style="width: 56px; height: 56px; border-radius: 12px; border: 1px solid #C7CDD4; background: #FFFFFF; font-size: 26px; font-weight: 700; color: #12151A">−</button>
            <div style="min-width: 90px; text-align: center; font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums">{{mesas}}</div>
            <button type="button" aria-label="Mais mesas" onClick="{{incMesas}}" style="width: 56px; height: 56px; border-radius: 12px; border: 1px solid #C7CDD4; background: #FFFFFF; font-size: 26px; font-weight: 700; color: #12151A">+</button>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
              <button type="button" onClick="{{p.pick}}" style="height: 44px; min-width: 56px; padding: 0 12px; border-radius: 999px; font-size: 15px; font-weight: 600; border: 2px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}">{{p.label}}</button>
            </sc-for>
          </div>
          <div style="font-size: 13px; color: #5A6270">As mesas não têm lugares fixos: todas começam com 0 pessoas. Quantas pessoas sentaram é informado ao abrir a comanda.</div>
        </div>

        <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none">Abrir caixa com {{mesas}} mesas</a>
      </section>

      <section aria-label="Prévia do salão" style="flex: 999 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE1E6; border-radius: 16px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700; margin-right: auto">Prévia do salão</h2>
          <span style="font-size: 14px; color: #5A6270">Todas livres · 0 pessoas</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px">
          <sc-for list="{{tables}}" as="t" hint-placeholder-count="20">
            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 80px; padding: 10px 12px; box-sizing: border-box; border-radius: 12px; border: 2px dashed #9AA3AF; background: #FFFFFF">
              <span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">{{t.num}}</span>
              <span style="font-size: 13px; color: #166534; font-weight: 700">Livre</span>
              <span style="font-size: 13px; color: #5A6270">0 pessoas</span>
            </div>
          </sc-for>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mesas: 20 };
  }
  renderVals() {
    const { mesas } = this.state;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const tables = [];
    for (let i = 1; i <= mesas; i++) tables.push({ num: String(i).padStart(2, '0') });
    const presets = [10, 15, 20, 25, 30].map((n) => ({
      label: String(n),
      bg: n === mesas ? '#12151A' : '#FFFFFF',
      fg: n === mesas ? '#FFFFFF' : '#12151A',
      bd: n === mesas ? '#12151A' : '#DDE1E6',
      pick: () => this.setState({ mesas: n })
    }));
    return {
      mesas, tables, presets,
      incMesas: () => this.setState({ mesas: clamp(mesas + 1, 1, 99) }),
      decMesas: () => this.setState({ mesas: clamp(mesas - 1, 1, 99) })
    };
  }
}
</script>
</body>
</html>
